<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#799a74" />
		<title>Offline / Social Giorgiovola Casa</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				padding: 20px;
				text-align: center;
				background: #0c0b0b;
				color: #d9d9d9;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			img {
				width: 96px;
				height: 96px;
				border-radius: 12px;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
			}
			p {
				margin: 0;
				color: #999;
			}
			button {
				margin-top: 8px;
				padding: 10px 20px;
				border: 0;
				border-radius: 8px;
				background: #799a74;
				color: #0c0b0b;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<img src="/icons/icon-192.png" alt="" />
		<h1>You're offline</h1>
		<p>Check your connection and try again.</p>
		<button onclick="location.reload()">Retry</button>
		<script>
			window.addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
